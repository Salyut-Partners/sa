<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Creative Factory Search</title>
    <link rel="stylesheet" href="./editor.css" />
    <!-- Before first paint, or the editor flashes white on its way to dark.
         Deliberately inline and duplicated from theme.ts: a module import would
         be a round trip, and the round trip is the flash. -->
    <script>
      try {
        var stored = localStorage.getItem('cfs-theme');
        var choice = stored === 'light' || stored === 'dark' ? stored : 'system';
        document.documentElement.dataset.theme =
          choice === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : choice;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
